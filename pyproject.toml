[project]
name = "piighost"
version = "1.4.0"
description = "Composable, reversible PII de-identification pipeline for LLM agents, with a LangChain middleware and pluggable detectors (NER, regex, LLM, custom)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Athroniaeth" },
]
keywords = [
    "pii",
    "anonymization",
    "de-identification",
    "pseudonymization",
    "nlp",
    "ner",
    "langchain",
    "langgraph",
    "gliner",
    "presidio",
    "spacy",
    "llm",
    "privacy",
    "ai",
    "agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/Athroniaeth/piighost"
Documentation = "https://athroniaeth.github.io/piighost/"
Repository = "https://github.com/Athroniaeth/piighost"
Issues = "https://github.com/Athroniaeth/piighost/issues"
Changelog = "https://github.com/Athroniaeth/piighost/blob/master/CHANGELOG.md"

[project.scripts]
piighost = "piighost.cli:main"

[project.optional-dependencies]
gliner2 = [
    "gliner2>=1.2",
]
redis = [
    "redis>=5",
]
langchain = [
    "langchain>=1.2",
]
# Alias of `langchain`, kept for back-compat. Prefer `piighost[langchain]`.
middleware = [
    "langchain>=1.2",
]
pydantic-ai = [
    "pydantic-ai>=2.0",
]
client = [
    "httpx>=0.28",
    "typing-extensions>=4.4; python_version < '3.11'",
]
spacy = [
    "spacy>=3.7",
]
transformers = [
    "transformers>=4.40",
    "torch>=2.0",
]
llm = [
    "langchain-core>=0.3",
    "langchain>=1.2",
]
observation = [
    "opentelemetry-api>=1.30",
]
fuzzy = [
    "rapidfuzz>=3.9",
]
config = [
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]
argon2 = [
    "argon2-cffi>=23.1",
]
crypto = [
    "cryptography>=44",
]
mistral = [
    "mistralai>=1.0",
]
presidio = [
    "presidio-analyzer>=2.2",
]
llama-index = [
    "llama-index-core>=0.14",
]
sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
]
all = [
    "piighost[gliner2,redis,langchain,middleware,pydantic-ai,client,spacy,transformers,llm,observation,fuzzy,config,argon2,crypto,mistral,sqlalchemy,presidio,llama-index]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piighost"]

[tool.hatch.build.targets.sdist]
# Ship only what a source install needs; keep docs/, site/, e2e/, benchmarks/,
# tools/, scripts/, publish/, and examples out of the source distribution.
only-include = [
    "src/piighost",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "pyrefly>=0.55.0",
    "zensical>=0.0.27",
    "commitizen>=4.13.9",
    "pre-commit>=4.0",
    "pytest-asyncio>=0.25",
    "bandit>=1.9.4",
    "streamlit>=1.46",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "redis>=5",
    "fakeredis>=2.20",
    "mistralai>=1.0",
    "langchain>=1.2",
    "pydantic-ai>=2.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "rapidfuzz>=3.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
]
gliner2 = [
    "gliner2>=1.2.4",
]
presidio = [
    "presidio-analyzer>=2.2",
]
llama-index = [
    "llama-index-core>=0.14",
]
langchain = [
    "langchain>=1.2.13",
]
spacy = [
    "spacy>=3.7",
]
transformers = [
    "transformers>=4.40",
    "torch>=2.0",
]
llm = [
    "langchain-core>=0.3",
    "langchain>=1.2",
]
observation = [
    "opentelemetry-api>=1.30",
]
fuzzy = [
    "rapidfuzz>=3.9",
]
config = [
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration' -p no:anyio -p no:faker -p no:langsmith_plugin -p no:opik"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that load heavy optional dependencies (torch, transformers, gliner2, spacy). Deselected by default.",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
# tools/ holds self-contained dev scripts (the animation generator), not
# library code, so they are exempt from the strict annotation lint.
extend-exclude = ["tools"]

[tool.ruff.lint]
# Typing is mandatory: flake8-annotations (ANN) flags any missing argument or
# return annotation, in src and tests alike. ANN401 stays off, so an explicit
# Any is allowed where a type genuinely cannot be narrowed.
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.pyrefly]
# Scratch scripts under scripts/ reference removed APIs, and e2e/ scripts pull in
# server deps absent from the main venv, so both would show spurious errors.
project-excludes = [
    ".claude/**",
    "scripts/**",
    "tools/**",
    "benchmarks/**",
    "e2e/**",
    "dist/**",
    "site/**",
]
# Extra search paths for pyrefly:
#  - ``examples`` lets the detector example package resolve ``from .common``.
#  - the project root lets test files do ``from tests.conftest import ...``.
search-path = ["examples", "."]

[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks",
    ".venv",
    "e2e",
    "site",
    "dist",
    "docs",
    ".idea",
    ".git",
    ".cache",
    ".pytest_cache",
    ".ruff_cache",
]
