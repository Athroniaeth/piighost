[project]
name = "piighost"
version = "0.14.0"
description = "Composable PII anonymization pipeline for LLM agents, with a LangChain middleware and pluggable detectors (NER, regex, LLM, custom)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Athroniaeth" },
]
keywords = [
    "pii",
    "anonymization",
    "nlp",
    "ner",
    "langchain",
    "langgraph",
    "gliner",
    "privacy",
    "ai",
    "agents",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/Athroniaeth/piighost"
Documentation = "https://github.com/Athroniaeth/piighost#readme"
Issues = "https://github.com/Athroniaeth/piighost/issues"
Changelog = "https://github.com/Athroniaeth/piighost/blob/master/CHANGELOG.md"

[project.scripts]
piighost = "piighost.cli:main"

[project.optional-dependencies]
gliner2 = [
    "gliner2>=1.2",
]
langchain = [
    "langchain>=1.2",
]
faker = [
    "faker>=40.11",
]
cache = [
    "aiocache>=0.12",
]
redis = [
    "redis>=5",
]
middleware = [
    "langchain>=1.2",
]
client = [
    "httpx>=0.28",
    "typing-extensions>=4.4; python_version < '3.11'",
]
spacy = [
    "spacy>=3.7",
]
transformers = [
    "transformers>=4.40",
    "torch>=2.0",
]
llm = [
    "langchain-core>=0.3",
]
sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]
langfuse = [
    "langfuse>=3.0",
]
opik = [
    "opik>=2.0",
]
config = [
    "pydantic>=2.6",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]
argon2 = [
    "argon2-cffi>=23.1",
]
crypto = [
    "cryptography>=44",
]
mistral = [
    "mistralai>=1.0",
]
all = [
    "piighost[gliner2,langchain,faker,cache,redis,client,spacy,transformers,llm,sqlalchemy,langfuse,opik,config,argon2,crypto,mistral]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piighost"]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "pyrefly>=0.55.0",
    "zensical>=0.0.27",
    "commitizen>=4.13.9",
    "pytest-asyncio>=0.25",
    "bandit>=1.9.4",
    "streamlit>=1.46",
    "pydantic>=2.6",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "redis>=5",
    "fakeredis>=2.20",
    "mistralai>=1.0",
    "langchain>=1.2",
]
faker = [
    "faker>=40.11.0",
]
gliner2 = [
    "gliner2>=1.2.4",
]
langchain = [
    "langchain>=1.2.13",
]
spacy = [
    "spacy>=3.7",
]
transformers = [
    "transformers>=4.40",
    "torch>=2.0",
]
pipeline = [
    "aiocache>=0.12.3",
]
redis = [
    "aiocache[redis]>=0.12",
]
llm = [
    "langchain-core>=0.3",
]
sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]
config = [
    "pydantic>=2.6",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration' -p no:anyio -p no:faker -p no:langsmith_plugin -p no:opik"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that load heavy optional dependencies (torch, transformers, gliner2, spacy). Deselected by default.",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
# v1 kept for reference during the rewrite; do not format or lint it.
extend-exclude = ["src/v1_piighost", "v1_tests"]

[tool.ruff.lint]
# Typing is mandatory: flake8-annotations (ANN) flags any missing argument or
# return annotation, in src and tests alike. ANN401 stays off, so an explicit
# Any is allowed where a type genuinely cannot be narrowed.
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.pyrefly]
# Examples in examples/graph/ and examples/llm/ live in their own environments
# (uv sub-project and PEP 723 inline metadata respectively), so their deps are
# not installed in the main venv and would otherwise show spurious
# missing-import errors. Scratch scripts under scripts/ have bit-rotted and
# reference removed APIs.
project-excludes = [
    # v1 kept for reference during the rewrite; its internal imports still
    # target the old ``piighost`` name, so exclude it from type checking.
    "src/v1_piighost/**",
    "v1_tests/**",
    "examples/graph/**",
    "examples/llm/**",
    ".claude/**",
    "scripts/**",
    "benchmarks/**",
    "dist/**",
    "site/**",
]
# Extra search paths for pyrefly:
#  - ``examples`` lets the detector example package resolve ``from .common``.
#  - the project root lets test files do ``from tests.conftest import ...``.
search-path = ["examples", "."]

[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks",
    ".venv",
    "examples/graph/.venv",
    "examples/graph/front",
    "site",
    "dist",
    "docs",
    ".idea",
    ".git",
    ".cache",
    ".pytest_cache",
    ".ruff_cache",
]
