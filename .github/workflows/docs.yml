name: Documentation

# The documentation lives on docs.piighost.dev, built by piighost-docs from this
# repository. Two jobs remain here: tell piighost-docs that its content changed,
# and keep the old GitHub Pages addresses working, each one now a redirect to
# its page on docs.piighost.dev.
on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "openwiki/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # A fine-grained token limited to piighost-docs, with Contents read and
      # write only: that is all a repository_dispatch needs.
      - run: |
          gh api repos/Athroniaeth/piighost-docs/dispatches \
            -f event_type=content-updated \
            -f "client_payload[sha]=$SHA"
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}

  redirects:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python docs/tools/redirects.py docs/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - uses: actions/deploy-pages@v5
        id: deployment
