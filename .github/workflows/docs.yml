name: Documentation

# The documentation lives on docs.piighost.dev, built by piighost-docs from this
# repository. Two jobs remain here: have Coolify rebuild the site, whose image
# build stops on a broken page, and keep the old GitHub Pages addresses working,
# each one now a redirect to its page on docs.piighost.dev.
on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "openwiki/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "$COOLIFY_DEPLOY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

  redirects:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python docs/tools/redirects.py docs/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - uses: actions/deploy-pages@v5
        id: deployment
