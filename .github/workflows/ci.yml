name: CI

on:
  # A release (release.yml) calls this workflow directly, so it always runs the
  # full gate regardless of what changed.
  workflow_call:
  # Documentation-only changes skip verification: the workflow runs unless every
  # changed file matches one of these patterns. This list mirrors the paths
  # allowlist in docs.yml (its inverse).
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "zensical.toml"
      - "zensical.fr.toml"
      - "overrides/**"
      - "LICENSE"
  push:
    branches: [master, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "zensical.toml"
      - "zensical.fr.toml"
      - "overrides/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  lint:
    name: Lint / Format / Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.13-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-3.13-
      # Sync full workspace (3.13 required by examples/graph) for lint
      - run: uv sync --locked --dev --no-progress -q
      - run: make lint

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.13-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-3.13-
      - run: uv sync --locked --dev --no-progress -q
      - run: uv run bandit -c pyproject.toml -r src examples

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, security]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
      - run: uv sync --locked --dev --no-progress -q
      - run: uv run pytest --cov=piighost --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Athroniaeth/piighost
          files: ./coverage.xml
          fail_ci_if_error: false
