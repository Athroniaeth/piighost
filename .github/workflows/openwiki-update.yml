name: OpenWiki Update

on:
  # Run by hand only. Each run is reviewed before it is merged, so a daily
  # schedule only piled up rewrites nobody had asked for.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.6.1 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          # Calls go through the LiteLLM gateway, which routes the model and
          # counts the spend. Its URL is the repo variable LITELLM_URL, the key
          # the secret LITELLM_API_KEY, and the model the LiteLLM model name.
          OPENAI_BASE_URL: ${{ vars.LITELLM_URL }}
          OPENAI_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          OPENWIKI_MODEL_ID: "openai/gpt-6.1-sol"
          # Required for the LangSmith connector's code-mode pull to authenticate.
          # For extra workspaces, add OPENWIKI_LANGSMITH_API_KEY_2, _3, ... as repo
          # secrets and env entries here.
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}
          # Optional: also trace this workflow's own OpenWiki run to LangSmith.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          # Tracing only when the key exists, otherwise every run logs 403s.
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGSMITH_API_KEY != '' && 'true' || 'false' }}

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: List OpenWiki update paths
        id: paths
        if: ${{ !cancelled() }}
        # A path is listed only when present and not ignored, because git add
        # fails on such a path and then stages nothing. AGENTS.md is ignored.
        run: |
          paths=openwiki,.github/workflows/openwiki-update.yml
          for f in AGENTS.md CLAUDE.md; do
            if [ -e "$f" ] && ! git check-ignore -q "$f"; then paths="$paths,$f"; fi
          done
          echo "list=$paths" >> "$GITHUB_OUTPUT"

      - name: Push the OpenWiki update branch
        if: ${{ !cancelled() }}
        # No pull request: the maintainer reviews openwiki/update and merges it
        # locally. Each run starts from master and replaces the branch.
        run: |
          IFS=, read -ra paths <<< "${{ steps.paths.outputs.list }}"
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No wiki change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update OpenWiki" -m "OpenWiki result: ${{ steps.openwiki.outcome }}"
          git push --force origin HEAD:refs/heads/openwiki/update
          echo "::notice title=OpenWiki update::Branch openwiki/update is ready, review it and merge it locally."

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
