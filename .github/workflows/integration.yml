name: Integration tests

# The integration suite loads heavy optional dependencies (torch, transformers,
# gliner2, spacy) and downloads models, so it is too slow for the PR gate. It runs
# nightly and on demand instead, and never blocks a merge.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (heavy optional deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
          key: ${{ runner.os }}-integration-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-integration-
      - run: uv sync --locked --all-extras --all-groups --no-progress -q
      # SpacyDetector integration tests skip unless the model is present.
      - run: uv run python -m spacy download en_core_web_sm
      - run: uv run pytest -m integration -v
